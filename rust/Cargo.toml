[workspace]
members = [
    "crates/capture-core",
    "crates/transport-core",
    "crates/tls-core",
    "crates/parser-core",
    "crates/storage-core",
    "crates/search-core",
    "crates/jni-bindings"
]
resolver = "2"

[workspace.dependencies]
jni = "0.21.1"
tokio = { version = "1.35", features = ["full"] }
rusqlite = { version = "0.30.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
rustls = "0.21.10"
httparse = "1.8.0"
regex = "1.10"
zeroize = { version = "1.7", features = ["derive"] }
rcgen = "0.11"
pnet = "0.34.0"
lazy_static = "1.4.0"
